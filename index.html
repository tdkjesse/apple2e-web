<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apple IIe Web</title><style>body{background:#101510;color:#c8f8c8;font:16px monospace;margin:0;padding:20px}main{max-width:850px;margin:auto}canvas{width:100%;image-rendering:pixelated;background:#071007;border:10px solid #3a4036;box-sizing:border-box}button{background:#253c25;color:#d9ffd9;border:1px solid #729572;padding:12px;margin:8px 8px 8px 0;font:inherit;cursor:pointer}#status{white-space:pre-wrap}</style></head><body><main><h1>APPLE IIe WEB — Phase 3</h1><canvas id="screen" width="560" height="384"></canvas><div><button id="reset">Reset demo</button><button id="step">Step CPU</button><button id="run">Run demo</button></div><p><label>Keyboard: <input id="keyboard" type="text" autocomplete="off" autocapitalize="characters" placeholder="Tap here to type"></label></p><p><label>Load 12 KiB system ROM (local file): <input id="rom" type="file" accept=".rom,.bin"></label></p><p id="status"></p><p>Experimental Apple IIe bus and keyboard. ROM loading is supported, but full ROM boot compatibility, 80-column mode, graphics, auxiliary RAM and disk emulation are not yet implemented.</p></main><script type="module" src="/src/main.ts"></script></body></html>
